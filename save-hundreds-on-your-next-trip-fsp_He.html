<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <title>Travel Advantage</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body, html { margin: 0; padding: 0; font-family: 'Assistant', Arial, sans-serif; background-color: white; overflow-x: hidden; }
    
    /* Hero Section */
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
      background-size: cover; padding: 40px 5%; display: flex; justify-content: center; align-items: center;
    }
    .hero-container { max-width: 1100px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 30px; flex-wrap: wrap-reverse; }
    .hero-content { flex: 1; color: white; text-align: center; text-shadow: 2px 4px 15px rgba(0,0,0,0.8); }
    .hero-content h1 { font-size: 65px; margin: 0 0 10px 0; color: #ff9d2b; font-weight: 900; line-height: 1.1; }
    .hero-content h2 { font-size: 28px; font-weight: 600; line-height: 1.3; color: #fff; margin: 0; }
    .image-box { flex: 0 1 350px; }
    .image-box img { width: 100%; border-radius: 35px; border: 8px solid white; box-shadow: 0 0 35px 10px rgba(255, 255, 255, 0.6), 0 20px 50px rgba(0,0,0,0.5); display: block; }

    /* Middle List */
    .content-area { padding: 15px 5% 25px 5%; text-align: center; max-width: 1200px; margin: 0 auto; }
    .wasting-title { color: #0056A7; font-size: 48px; font-weight: 900; margin: 0 0 15px 0; line-height: 1.1; }
    .wasting-list { font-size: 28px; line-height: 1.4; color: #333; list-style: none; padding: 0; text-align: right; display: inline-block; margin: 0; }
    .wasting-list li { margin-bottom: 8px; padding-right: 20px; border-right: 10px solid #ff9d2b; }

    /* Footer Bg */
    .footer-bg {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
      background-size: cover; padding: 50px 5%; display: flex; justify-content: center;
    }
    .footer-container { max-width: 1300px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; }
    .footer-text-column { flex: 1.5; display: flex; flex-direction: column; align-items: center; min-width: 550px; position: relative; }
    .footer-text { color: #ff9d2b; font-size: 55px; font-weight: 900; text-align: center; text-shadow: 3px 3px 15px rgba(0,0,0,1); line-height: 1.1; }
    
    .arrow-container { position: absolute; left: 0; bottom: -60px; width: 130px; animation: flashArrow 1.2s infinite ease-in-out; }
    @keyframes flashArrow { 0%, 100% { opacity: 1; transform: scale(1) scaleX(-1); } 50% { opacity: 0.4; transform: scale(1.05) scaleX(-1); } }

    /* Form */
    .form-box { flex: 1; background: white; padding: 15px 35px 35px 35px; border-radius: 35px; min-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,0.7); }
    .form-box h3 { color: #0056A7; margin: 0 0 5px 0; font-size: 32px; text-align: center; font-weight: 900; }
    .form-subtitle { color: #0056A7; font-size: 32px; text-align: center; margin-bottom: 20px; font-weight: 900; display: block; }
    input { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #eee; font-size: 19px; text-align: right; box-sizing: border-box; }
    .submit-btn { background: #0056A7; color: white; width: 100%; padding: 20px; border: none; border-radius: 12px; font-size: 26px; font-weight: 900; cursor: pointer; transition: 0.3s; width: 100%; }

    /* המבנה החדש של הפוטר לפי החברה */
    .rf-agent-footer { background-color: #000; color: white; padding: 40px 20px; text-align: center; border-top: 1px solid #333; }
    .agent-card { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .agent-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; }
    .agent-name { font-size: 24px; font-weight: bold; margin: 0; }
    .agent-contact { font-size: 18px; margin: 5px 0; color: #ddd; text-decoration: none; display: block; }
    .book-me-btn { background: #f0f0f0; color: #000; padding: 10px 30px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-top: 10px; display: inline-block; }
    .social-links { margin-top: 20px; display: flex; gap: 15px; justify-content: center; }
    .social-links a { color: white; font-size: 24px; text-decoration: none; }
    
    .rf-legal-footer { background-color: #1a1a1a; color: #888; padding: 20px; font-size: 14px; border-top: 1px solid #333; }
    .rf-legal-footer a { color: #888; text-decoration: none; margin: 0 10px; }
  </style>
</head>
<body>

  <section class="hero-section">...</section>
  <div class="content-area">...</div>
  <section class="footer-bg">...</section>

  <footer class="rf-agent-footer">
    <div class="agent-card">
      <img src="https://via.placeholder.com/150" class="agent-avatar" id="agentImage">
      <h4 class="agent-name" id="agentName">טוען שם...</h4>
      <div id="agentDetails">
        <a href="#" class="agent-contact" id="agentEmail"><i class="fas fa-envelope"></i> email@example.com</a>
        <a href="#" class="agent-contact" id="agentPhone"><i class="fas fa-phone"></i> 050-0000000</a>
      </div>
      <a href="#" class="book-me-btn">Book Me</a>
      <div class="social-links">
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-tiktok"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-facebook"></i></a>
      </div>
    </div>
  </footer>

  <div class="rf-legal-footer">
    <div>Copyright 2026 | <a href="#">Terms and Conditions</a> | <a href="#">Privacy Policy</a></div>
    <div style="margin-top: 5px;">Powered by RapidFunnel.</div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/userDetails.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    window.userId = urlParams.get('userId') || '358354'; 

    $(document).ready(function() {
      // כאן אנחנו מחברים את הסקריפט של RapidFunnel כדי שימשוך את הפרטים האמיתיים שלך לתוך הפוטר החדש
      if (typeof getAgentDetails === "function") {
          getAgentDetails(window.userId).then(data => {
              if(data) {
                  $('#agentName').text(data.firstName + ' ' + data.lastName);
                  $('#agentEmail').html('<i class="fas fa-envelope"></i> ' + data.email);
                  $('#agentPhone').html('<i class="fas fa-phone"></i> ' + data.phone);
                  if(data.profileImage) $('#agentImage').attr('src', data.profileImage);
              }
          });
      }
    });
  </script>
</body>
</html>
