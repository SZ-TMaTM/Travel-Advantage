<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <title>Travel Advantage</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <style>
    /* עיצוב בסיסי */
    body, html { margin: 0; padding: 0; font-family: 'Assistant', Arial, sans-serif; background-color: white; overflow-x: hidden; }
    
    /* Hero & Content */
    .hero-section { background: linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000') no-repeat center; background-size: cover; padding: 40px 5%; display: flex; justify-content: center; }
    .hero-container { max-width: 1100px; display: flex; align-items: center; gap: 30px; flex-wrap: wrap-reverse; }
    .hero-content { flex: 1; color: white; text-align: center; }
    .hero-content h1 { font-size: 65px; color: #ff9d2b; font-weight: 900; }
    .image-box img { width: 350px; border-radius: 35px; border: 8px solid white; box-shadow: 0 0 35px rgba(255,255,255,0.6); }

    .content-area { padding: 40px 5%; text-align: center; max-width: 1200px; margin: 0 auto; }
    .wasting-title { color: #0056A7; font-size: 42px; font-weight: 900; }
    .wasting-list { font-size: 24px; text-align: right; list-style: none; display: inline-block; padding: 0; }
    .wasting-list li { margin-bottom: 10px; border-right: 8px solid #ff9d2b; padding-right: 15px; }

    /* Form Section */
    .footer-bg { background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000') no-repeat center; background-size: cover; padding: 60px 5%; display: flex; justify-content: center; }
    .footer-container { max-width: 1200px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 50px; flex-wrap: wrap; }
    .footer-text { color: #ff9d2b; font-size: 45px; font-weight: 900; text-align: center; line-height: 1.1; }
    .form-box { background: white; padding: 30px; border-radius: 35px; min-width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; text-align: right; box-sizing: border-box; }
    .submit-btn { background: #0056A7; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 20px; font-weight: 900; cursor: pointer; }

    /* --- RAPIDFUNNEL FOOTER (EXACT CSS) --- */
    .rapidfunnel-components--footer_section { background-color: #000; color: #fff; padding: 60px 20px; direction: ltr; }
    .rapidfunnel-components--footer_container { display: flex; align-items: center; justify-content: center; max-width: 1000px; margin: 0 auto; gap: 40px; }
    .rapidfunnel-components--profileimage { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
    .rapidfunnel-components--info_wrapper { text-align: left; }
    .rapidfunnel-components--namediv { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
    .rapidfunnel-components--user_info_text { font-size: 18px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
    .rapidfunnel-components--link_standard { color: #fff; text-decoration: none; }
    .rapidfunnel-components--book_me_button_centered { background-color: #fff; color: #000; padding: 8px 25px; border-radius: 20px; text-decoration: none; font-weight: bold; display: inline-block; margin: 15px 0; }
    
    .social-links-wrapper { display: flex; gap: 10px; margin-top: 10px; }
    .rapidfunnel-components--link_social { width: 40px; height: 40px; border: 1px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
    .rapidfunnel-components--link_social svg { width: 20px; fill: white; }

    .footer-bottom { background-color: #111; padding: 30px; border-top: 1px solid #222; text-align: center; color: #888; font-size: 14px; }
    .footer-links { list-style: none; padding: 0; margin: 0 0 15px; display: flex; justify-content: center; gap: 20px; }
    .footer-links a { color: #888; text-decoration: none; }
    .rf-logo { width: 180px; margin-top: 10px; }
  </style>
</head>
<body>

  <section class="hero-section">
    <div class="hero-container">
      <div class="image-box"><img src="https://my.aimmwrlife.com/images/Happy-Girl.png"></div>
      <div class="hero-content">
        <h1>חסכו מאות דולרים<br>בטיול הבא שלכם!</h1>
      </div>
    </div>
  </section>

  <section class="footer-bg">
    <div class="footer-container">
      <div class="footer-text">הצטרפו לאלפי מטיילים!</div>
      <div class="form-box">
        <form id="rfContactForm">
          <input type="text" id="contactFirstName" placeholder="שם פרטי" required>
          <input type="text" id="contactLastName" placeholder="שם משפחה" required>
          <input type="email" id="contactEmail" placeholder="אימייל" required>
          <input type="tel" id="contactPhone" placeholder="טלפון" required>
          <button type="submit" class="submit-btn">שלחו לי את המדריך!</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="rapidfunnel-components--footer_section">
    <div class="rapidfunnel-components--footer_container">
      <img src="" id="profileImage" class="rapidfunnel-components--profileimage">
      <div class="rapidfunnel-components--info_wrapper">
        <div class="rapidfunnel-components--namediv">
          <span class="firstName">[firstName]</span> <span class="lastName">[lastName]</span>
        </div>
        <div class="rapidfunnel-components--user_info_text">
          <a id="email" href="#" class="rapidfunnel-components--link_standard">[email]</a>
        </div>
        <div class="rapidfunnel-components--user_info_text">
          <a id="phoneNumber" href="#" class="rapidfunnel-components--link_standard">[phoneNumber]</a>
        </div>
        <a id="customBookingLink" href="#" class="rapidfunnel-components--book_me_button_centered">Book Me</a>

        </div>
      </div>
    </div>
  </footer>

  <div class="footer-bottom">
    <ul class="footer-links">
      <li>Copyright 2026</li>
      <li><a href="https://rapidfunnel.com/terms-conditions/">Terms and Conditions</a></li>
      <li><a href="https://rapidfunnel.com/privacy_policy_terms/">Privacy Policy</a></li>
    </ul>
    <img src="https://cdn.prod.website-files.com/67162c08851e5c2cccf41b56/6718d8483fe0f45ee8eea17f_RF%20LOGO%20FOOTER.svg" class="rf-logo">
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/userDetails.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/contactForm.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    window.userId = urlParams.get('userId') || '358354'; 
  </script>
</body>
</html>
