<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <title>Travel Advantage - חסוך מאות דולרים</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <style>
    body, html { margin: 0; padding: 0; font-family: 'Assistant', Arial, sans-serif; background-color: white; overflow-x: hidden; }
    
    /* חלק עליון - כותרת ענקית */
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
      background-size: cover; padding: 120px 5%; display: flex; justify-content: center; min-height: 650px; align-items: center;
    }
    .hero-container { max-width: 1300px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 60px; flex-wrap: wrap-reverse; }
    .hero-content { flex: 1.5; color: white; text-align: right; text-shadow: 3px 3px 20px rgba(0,0,0,0.8); }
    .hero-content h1 { font-size: 85px; margin-bottom: 30px; color: #ff9d2b; font-weight: 900; line-height: 1.1; }
    .hero-content h2 { font-size: 42px; font-weight: bold; line-height: 1.3; }
    .image-box { flex: 1; background: white; padding: 15px; border-radius: 35px; box-shadow: 0 30px 70px rgba(0,0,0,0.5); max-width: 480px; }
    .image-box img { width: 100%; border-radius: 25px; display: block; }

    /* חלק אמצעי - יתרונות ענקיים */
    .benefits-section { padding: 120px 5%; text-align: center; background: #ffffff; }
    .benefits-section h2 { color: #0056A7; font-size: 65px; margin-bottom: 60px; font-weight: 900; }
    .benefits-list { list-style: none; padding: 0; display: inline-block; text-align: right; font-size: 38px; line-height: 1.8; font-weight: bold; }
    .benefits-list li::before { content: '✔️'; color: #0056A7; margin-left: 25px; font-size: 45px; }

    /* חלק תחתון - הרים וטופס */
    .footer-bg {
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                  url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
      background-size: cover; padding: 150px 5%; display: flex; justify-content: center;
    }
    .footer-container { 
      max-width: 1400px; width: 100%; display: flex; align-items: center; 
      justify-content: space-between; gap: 20px; position: relative;
    }
    
    .footer-text { flex: 1.5; color: #ff9d2b; font-size: 70px; font-weight: 900; text-align: right; text-shadow: 4px 4px 25px rgba(0,0,0,1); line-height: 1.1; position: relative; }
    
    /* החץ הלבן, המעוגל והגדול בסגנון האתר המקורי */
    .arrow-svg-container {
      position: absolute;
      left: -150px;
      top: 50%;
      transform: translateY(-50%);
      width: 250px;
      z-index: 10;
      animation: pulseArrow 2s infinite ease-in-out;
    }

    @keyframes pulseArrow {
      0%, 100% { transform: translateY(-50%) scale(1); filter: drop-shadow(0 0 5px white); }
      50% { transform: translateY(-50%) scale(1.1); filter: drop-shadow(0 0 15px white); }
    }

    .form-box { 
      flex: 1; background: white; padding: 60px; border-radius: 40px; min-width: 480px; 
      box-shadow: 0 25px 60px rgba(0,0,0,0.6); box-sizing: border-box; z-index: 5;
    }
    .form-box h3 { color: #0056A7; margin-bottom: 40px; font-size: 45px; text-align: center; font-weight: bold; }
    input { width: 100%; padding: 25px; margin-bottom: 25px; border-radius: 20px; border: 3px solid #eee; font-size: 24px; text-align: right; box-sizing: border-box; }
    .submit-btn { background: #0056A7; color: white; width: 100%; padding: 25px; border: none; border-radius: 20px; font-size: 32px; font-weight: bold; cursor: pointer; }

    #rf-user-details { background: #000; color: #fff; padding: 40px; width: 100%; border-top: 8px solid #ff9d2b; }

    @media (max-width: 1250px) {
      .footer-container { flex-direction: column !important; text-align: center; }
      .arrow-svg-container { display: none; } /* מסתירים את החץ במובייל כדי שלא יסתיר טקסט */
      .footer-text { text-align: center; font-size: 50px; }
      .form-box { min-width: 100%; }
    }
  </style>
</head>
<body>

  <section class="hero-section">
    <div class="hero-container">
      <div class="image-box"><img src="https://my.aimmwrlife.com/images/Happy-Girl.png"></div>
      <div class="hero-content">
        <h1>חסוך מאות דולרים בטיול הבא שלך!</h1>
        <h2>גלה איך המטיילים החכמים סוגרים חופשות בחצי מחיר תוך דקות.</h2>
      </div>
    </div>
  </section>

  <section class="benefits-section">
    <h2>למה לשלם יותר כשאפשר פחות?</h2>
    <ul class="benefits-list">
      <li>גישה למחירים סיטונאיים בלעדיים</li>
      <li>מערכת הזמנות חכמה ופשוטה</li>
      <li>תמיכה ושירות אישי לכל אורך הדרך</li>
    </ul>
  </section>

  <section class="footer-bg">
    <div class="footer-container">
      <div class="footer-text">
        הצטרף לאלפי מטיילים שהופכים את הטיולים שלהם לבלתי נשכחים!
        
        <div class="arrow-svg-container">
          <svg viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 80C50 80 150 70 180 10" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M165 20L185 8L188 32" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="form-box">
        <h3>קבל את המדריך בחינם!</h3>
        <form id="rfContactForm">
          <input type="text" id="contactFirstName" placeholder="שם פרטי" required>
          <input type="text" id="contactLastName" placeholder="שם משפחה" required>
          <input type="email" id="contactEmail" placeholder="אימייל" required>
          <input type="tel" id="contactPhone" placeholder="טלפון" required>
          <button type="submit" class="submit-btn">אני רוצה לחסוך!</button>
        </form>
      </div>
    </div>
  </section>

  <div id="rf-user-details"></div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/userDetails.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/contactForm.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    window.userId = urlParams.get('userId') || '358354';
    window.resourceId = urlParams.get('resourceId') || '67370';
    window.assignCampaignId = 2434;
    window.labelId = 48708;

    $(document).ready(function() {
      if (typeof renderUserDetails === "function") {
        renderUserDetails('#rf-user-details');
      }
    });
  </script>
</body>
</html>
