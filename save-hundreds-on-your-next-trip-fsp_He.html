<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <title>Travel Advantage - חסוך מאות דולרים</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <style>
    /* הגדרות בסיס */
    body, html { margin: 0; padding: 0; font-family: 'Assistant', Arial, sans-serif; background-color: white; overflow-x: hidden; }
    
    /* חלק עליון: הבחורה והים */
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
      background-size: cover; padding: 60px 5%; display: flex; justify-content: center; min-height: 450px;
    }
    .hero-container { max-width: 1200px; width: 100%; display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap-reverse; }
    .hero-content { flex: 1; color: white; text-align: right; min-width: 300px; }
    .hero-content h1 { font-size: 42px; margin-bottom: 20px; color: #ff9d2b; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
    .image-box { background: white; padding: 10px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 350px; }
    .image-box img { width: 100%; border-radius: 20px; display: block; }

    /* חלק אמצעי: יתרונות */
    .benefits-section { padding: 60px 5%; text-align: center; background: #f9f9f9; }
    .benefits-section h2 { color: #0056A7; font-size: 32px; margin-bottom: 30px; }
    .benefits-list { list-style: none; padding: 0; display: inline-block; text-align: right; font-size: 20px; line-height: 2; }
    .benefits-list li::before { content: '✔️'; color: #0056A7; margin-left: 10px; font-weight: bold; }

    /* חלק תחתון: הרים וטופס */
    .footer-bg {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                  url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
      background-size: cover; padding: 80px 5%; display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .footer-title { color: #ff9d2b; font-size: 36px; margin-bottom: 40px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); max-width: 800px; }
    
    /* עיצוב הטופס */
    .form-box { 
      background: white; padding: 35px; border-radius: 25px; width: 100%; max-width: 420px; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.3); box-sizing: border-box;
    }
    .form-box h3 { color: #0056A7; margin-top: 0; margin-bottom: 20px; font-size: 24px; }
    input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; text-align: right; box-sizing: border-box; }
    .submit-btn { background: #0056A7; color: white; width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .submit-btn:hover { background: #003d7a; }

    /* פוטר סוכן - שחור */
    #rf-user-details { background: #000; color: #fff; padding: 20px; min-height: 80px; width: 100%; }

    @media (max-width: 768px) {
      .hero-content h1 { font-size: 32px; }
      .footer-title { font-size: 28px; }
    }
  </style>
</head>
<body>

  <header class="hero-section">
    <div class="hero-container">
      <div class="image-box"><img src="https://my.aimmwrlife.com/images/Happy-Girl.png"></div>
      <div class="hero-content">
        <h1>חסוך מאות דולרים בטיול הבא!</h1>
        <p style="font-size: 22px;">גלה איך לסגור חופשות בחצי מחיר תוך דקות.</p>
      </div>
    </div>
  </header>

  <section class="benefits-section">
    <h2>למה לשלם יותר כשאפשר פחות?</h2>
    <ul class="benefits-list">
      <li>גישה למחירים סיטונאיים בלעדיים.</li>
      <li>מערכת הזמנות חכמה, פשוטה ומהירה.</li>
      <li>תמיכה ושירות אישי לכל אורך הדרך.</li>
    </ul>
  </section>

  <section class="footer-bg">
    <h2 class="footer-title">הצטרף לאלפי מטיילים שהופכים את הטיולים שלהם לבלתי נשכחים.</h2>
    <div class="form-box">
      <h3>קבל את המדריך בחינם!</h3>
      <form id="rfContactForm">
        <input type="text" id="contactFirstName" placeholder="שם פרטי" required>
        <input type="text" id="contactLastName" placeholder="שם משפחה" required>
        <input type="email" id="contactEmail" placeholder="אימייל" required>
        <input type="tel" id="contactPhone" placeholder="טלפון" required>
        <button type="submit" class="submit-btn">אני רוצה לחסוך!</button>
      </form>
    </div>
  </section>

  <div id="rf-user-details"></div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/userDetails.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/contactForm.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    window.userId = urlParams.get('userId') || '358354';
    window.resourceId = urlParams.get('resourceId') || '67370';
    window.assignCampaignId = 2434;
    window.labelId = 48708;

    $(document).ready(function() {
      if (typeof renderUserDetails === "function") {
        renderUserDetails('#rf-user-details');
      }
    });
  </script>
</body>
</html>
