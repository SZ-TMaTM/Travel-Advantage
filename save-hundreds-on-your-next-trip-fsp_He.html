<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <title>Travel Advantage - חיסכון בנסיעות</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <style>
    body, html { margin: 0; padding: 0; font-family: 'Assistant', Arial, sans-serif; background-color: white; }
    
    /* עיצוב הדף (מקוצר לצורך המענה) */
    .hero-section { background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000') no-repeat center; background-size: cover; padding: 60px 5%; min-height: 400px; display: flex; justify-content: center; align-items: center; color: white; text-align: right; }
    .hero-content h1 { font-size: 42px; color: #ff9d2b; }
    
    .details-section { padding: 60px 5%; text-align: center; }
    .details-list { list-style: none; padding: 0; display: inline-block; text-align: right; font-size: 20px; }
    .details-list li::before { content: '✔️ '; color: #0056A7; }

    .footer-section { background: #eee; padding: 60px 5%; display: flex; justify-content: center; }
    .form-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; text-align: right; box-sizing: border-box; }
    .submit-btn { width: 100%; padding: 15px; background: #0056A7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* פוטר סוכן דינמי - הפס השחור */
    #dynamic-agent-footer {
      background-color: #1a1a1a;
      color: white;
      padding: 20px;
      direction: ltr;
      border-top: 3px solid #ff9d2b;
    }
    .agent-flex { display: flex; align-items: center; justify-content: center; gap: 15px; max-width: 1000px; margin: 0 auto; }
    .agent-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #ff9d2b; object-fit: cover; }
    .agent-info { text-align: left; }
    .agent-name { font-weight: bold; font-size: 18px; color: #ff9d2b; display: block; }
    .agent-phone { font-size: 14px; color: #ccc; }
  </style>
</head>
<body>

  <section class="hero-section">
    <div class="hero-content">
      <h1>חסוך מאות דולרים בטיול הבא!</h1>
      <h2>הצטרף למהפכת התיירות החכמה.</h2>
    </div>
  </section>

  <section class="details-section">
    <h2>למה לשלם יותר כשאפשר פחות?</h2>
    <ul class="details-list">
      <li>גישה למחירים סיטונאיים שלא פתוחים לקהל הרחב.</li>
      <li>מערכת הזמנות חכמה ופשוטה.</li>
      <li>תמיכה ושירות לכל אורך הדרך.</li>
    </ul>
  </section>

  <section class="footer-section">
    <div class="form-container">
      <form id="rfContactForm">
        <input type="text" id="contactFirstName" placeholder="שם פרטי" required>
        <input type="text" id="contactLastName" placeholder="שם משפחה" required>
        <input type="email" id="contactEmail" placeholder="אימייל" required>
        <input type="tel" id="contactPhone" placeholder="טלפון" required>
        <button type="submit" class="submit-btn">קבל פרטים עכשיו</button>
      </form>
    </div>
  </section>

  <div id="dynamic-agent-footer">
    <div class="agent-flex">
      <img id="agent-image" class="agent-img" src="https://rapidfunnel.com/wp-content/uploads/2021/01/user-icon.png">
      <div class="agent-info">
        <span id="agent-name" class="agent-name">טוען פרטי סוכן...</span>
        <span id="agent-phone" class="agent-phone"></span>
      </div>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/userDetails.js"></script>
  <script src="https://rapidfunnel.github.io/rf-scripts/v1/contactForm.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId') || '358354'; // ברירת מחדל אם אין ב-URL
    
    window.userId = userId;
    window.resourceId = urlParams.get('resourceId') || '67370';
    window.assignCampaignId = 2434;
    window.labelId = 48708;

    $(document).ready(function() {
      // משיכת נתונים ישירה מה-API של RapidFunnel כדי לעקוף את החסימה של Vercel
      $.ajax({
        url: `https://api.rapidfunnel.com/v1/users/details?userId=${userId}`,
        method: 'GET',
        success: function(data) {
          if (data && data.user) {
            $('#agent-name').text(data.user.firstName + " " + data.user.lastName);
            $('#agent-phone').text(data.user.phone || "Travel Consultant");
            if (data.user.profileImage) {
              $('#agent-image').attr('src', data.user.profileImage);
            }
          }
        },
        error: function() {
          // אם ה-API חסום, ננסה להשתמש בסקריפט המקורי שלהם כגיבוי
          if (typeof renderUserDetails === "function") {
            renderUserDetails('#dynamic-agent-footer');
          }
        }
      });
    });
  </script>
</body>
</html>
