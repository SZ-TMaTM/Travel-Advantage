<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חופשה חלומית</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .video-wrapper { position: relative; max-width: 800px; margin: auto; }
        iframe { width: 100%; height: 450px; border: none; }
    </style>
</head>
<body>

    <h2>צפייה בסרטון - בדיקת מערכת</h2>
    <div class="video-wrapper">
        <iframe id="bunny-video" src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff" allowfullscreen></iframe>
    </div>

    <script>
        // שליפת ה-ID מהכתובת
        const leadId = window.location.pathname.split('/').filter(p => p.length > 0).pop() || 'test_user';
        const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";

        function sendToMake(status) {
            console.log("מנסה לשלוח: " + status);
            // שימוש ב-Image Beacon - הדרך הכי חסינה לחסימות דפדפן
            const img = new Image();
            img.src = `${webhookUrl}?lead_id=${leadId}&status=${status}&time=${Date.now()}`;
            
            // גיבוי נוסף בשיטה רגילה
            fetch(`${webhookUrl}?lead_id=${leadId}&status=${status}`, { mode: 'no-cors' });
        }

        // דיווח מיידי כשהדף נטען כדי לראות שמייק מקבל משהו
        sendToMake('Page_Loaded');

        // האזנה לסרטון
        window.addEventListener("message", function(event) {
            if (event.origin !== "https://iframe.mediadelivery.net") return;
            let data;
            try { data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch(e) { return; }

            if (data.event === "play") sendToMake('Started_Viewing');
            if (data.event === "timeupdate") {
                const progress = (data.value / data.duration) * 100;
                if (progress >= 50 && progress < 55) sendToMake('Watched_50_Percent');
                if (progress >= 95) sendToMake('Watched_100_Percent');
            }
        });
    </script>
</body>
</html>
