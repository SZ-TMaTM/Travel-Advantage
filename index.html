<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@900&display=swap" rel="stylesheet">
    <title>חופשה חלומית</title>
    <style>
        body { font-family: 'Heebo', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 10px; }
        .container { max-width: 1050px; margin: 5px auto; background: white; padding: 25px 20px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .video-wrapper { position: relative; width: 100%; max-width: 950px; margin: 0 auto; padding-bottom: 56.25%; height: 0; border-radius: 20px; background: #000; border: 4px solid #fff; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="video-wrapper">
        <iframe id="bunny-video" src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=false" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
</div>

<script>
    const leadId = window.location.pathname.split('/').filter(p => p.length > 0).pop() || 'General_Visitor';
    const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
    let sentMilestones = new Set();

    function sendToMake(status) {
        if (sentMilestones.has(status)) return;
        sentMilestones.add(status);
        
        fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ lead_id: leadId, status: status })
        });
        console.log("דיווח נשלח למייק: " + status);
    }

    // הקשבה להודעות מהנגן של באני בצורה ישירה (לא נחסם)
    window.addEventListener("message", function(event) {
        // וודא שההודעה מגיעה מהנגן של באני
        if (event.origin !== "https://iframe.mediadelivery.net") return;

        let data;
        try {
            data = JSON.parse(event.data);
        } catch (e) { return; }

        // בדיקת זמן וסטטוסים
        if (data.event === "play") sendToMake('Started_Viewing');
        
        if (data.event === "timeupdate") {
            const currentTimeInMinutes = data.value / 60;
            const durationInMinutes = data.duration / 60;
            const progress = (data.value / data.duration) * 100;

            if (currentTimeInMinutes >= 1 && currentTimeInMinutes < 12) sendToMake('Watched_Less_Than_12Min');
            if (currentTimeInMinutes >= 12) sendToMake('Watched_12Min_Plus');
            if (progress >= 75 && progress < 95) sendToMake('Watched_75_Percent');
            if (progress >= 95) sendToMake('Watched_100_Percent');
        }
    });
</script>
</body>
</html>
