<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חופשה חלומית</title>
    <script src="https://iframe.mediadelivery.net/playerv2.js?id=586762"></script>
    <style>
        body { font-family: 'Heebo', sans-serif; text-align: center; background-color: #f4f7f9; margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: 10px auto; background: white; padding: 20px; border-radius: 30px; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: #000; border: 5px solid #fff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="video-wrapper">
        <iframe id="bunny-video" 
            src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=true" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>
</div>

<script>
    const webhookUrl = "https://hook.eu1.make.com/60mbe87l2p39x6j9579oowatj1m6m0r9";
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || "972504746464";
    let sent = { '25%': false, '75%': false, '95%': false };

    function report(status) {
        fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ phone: phone, status: status })
        });
        console.log("דיווח נשלח למייק:", status);
    }

    // דיווח טעינה
    report("Page_Loaded");

    // פונקציה שמפעילה את המעקב רק כשהנגן מוכן
    function initPlayer() {
        try {
            const player = new BunnyStreamPlayer('bunny-video');
            player.on('timeupdate', (data) => {
                if (data.duration > 0) {
                    const percent = Math.floor((data.currentTime / data.duration) * 100);
                    
                    // זה יוודא שאתה רואה שמשהו קורה בקונסול
                    if (percent % 5 === 0) console.log("התקדמות צפייה:", percent + "%");

                    if (percent >= 25 && !sent['25%']) { report("25%"); sent['25%'] = true; }
                    if (percent >= 75 && !sent['75%']) { report("75%"); sent['75%'] = true; }
                    if (percent >= 95 && !sent['95%']) { report("95%"); sent['95%'] = true; }
                }
            });
        } catch (e) {
            console.log("מחכה לנגן שייטען...");
            setTimeout(initPlayer, 1000); // מנסה שוב בעוד שנייה אם נכשל
        }
    }

    // הפעלה
    window.onload = initPlayer;
</script>
</body>
</html>
