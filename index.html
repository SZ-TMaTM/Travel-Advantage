<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>בדיקת מערכת</title>
</head>
<body style="text-align:center; font-family:Arial;">
    <h1>הסרטון רץ - נא לא לסגור</h1>
    
    <iframe id="bunny-video" 
        src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=true" 
        width="800" height="450" allowfullscreen>
    </iframe>

    <script>
        const webh = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
        const ph = new URLSearchParams(window.location.search).get('phone') || "972504746464";
        
        console.log("--- המערכת הופעלה ---");

        function report(s) {
            fetch(webh, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ phone: ph, status: s }) });
            console.log("דיווח נשלח למייק: " + s);
        }

        report("Page_Loaded");

        let seconds = 0;
        // טיימר פשוט שרץ כל שנייה ומדפיס לקונסול
        setInterval(() => {
            seconds++;
            console.log("שניות שעברו: " + seconds);

            // בדיקת 30 שניות ראשונות רק כדי לראות שזה עובד!
            if (seconds == 30) { report("25"); } 
            
            // המקוריים שלך (זמנים משוערים)
            if (seconds == 480) { report("25"); }
            if (seconds == 1500) { report("75"); }
            if (seconds == 1860) { report("95"); }
        }, 1000);
    </script>
</body>
</html>
