<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@900&display=swap" rel="stylesheet">
    <title>חופשה חלומית במחירים הכי זולים בעולם בהתחייבות</title>
    <script src="https://iframe.mediadelivery.net/playerv2.js"></script>
    <style>
        body { 
            font-family: 'Heebo', sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0; 
            padding: 10px;
        }
        .container { 
            max-width: 1050px; 
            margin: 5px auto; 
            background: white; 
            padding: 25px 20px; 
            border-radius: 25px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        .main-title {
            font-size: clamp(18px, 4vw, 32px); 
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; 
            background: #1a73e8; /* רקע כחול לכותרת כמו בעיצוב המקורי */
            padding: 15px;
            border-radius: 15px;
        }
        .flyer-style {
            padding: 0 10px; 
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 4px 4px 0px rgba(0,0,0,0.8);
        }
        .yellow-text { color: #ffcc00; }
        .white-text { color: #ffffff; }
        .red-badge { 
            background: #e60000; 
            color: white; 
            padding: 5px 18px; 
            border-radius: 10px; 
            box-shadow: 3px 3px 0px #000;
        }
        .video-wrapper { 
            position: relative; 
            width: 100%;
            max-width: 950px; 
            margin: 0 auto;
            padding-bottom: 56.25%; /* יחס 16:9 מושלם */
            height: 0; 
            overflow: hidden; 
            border-radius: 20px; 
            background: #000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 4px solid #fff;
        }
        .video-wrapper iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }
        .warning-text {
            margin-top: 15px;
            color: #d32f2f;
            font-weight: 700;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">
        <span class="flyer-style yellow-text">חופשה חלומית</span>
        <span class="flyer-style white-text">במחירים הכי זולים בעולם</span>
        <span class="red-badge">בהתחייבות!</span>
    </div>

    <div class="video-wrapper">
        <iframe id="bunny-video" 
            src="https://player.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=true" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>
    
    <div class="warning-text">⚠️ נא לא לרענן את הדף כדי לא לאבד את התקדמות הצפייה</div>
</div>

<script>
    // זיהוי הליד מהכתובת
    const leadId = window.location.pathname.split('/').pop() || "unknown";
    const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
    
    let sent50 = false, sent75 = false, sent95 = false;

    function reportToMake(status) {
        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                lead_id: leadId, 
                status: status,
                timestamp: new Date().toISOString()
            })
        }).catch(err => console.log('Report skip'));
    }

    // דיווח ראשון - כניסה לדף
    reportToMake("Page_Loaded");

    // חיבור לנגן Bunny
    const player = new BunnyCDNPlayer('bunny-video');

    // בדיקה כל 5 שניות של אחוזי צפייה
    setInterval(() => {
        player.getCurrentTime((time) => {
            player.getDuration((duration) => {
                if (duration > 0) {
                    const percent = (time / duration) * 100;
                    
                    // דיווח 50% (מעל 12 דקות)
                    if (percent >= 50 && !sent50) { 
                        reportToMake("Watched_Over_12_Min"); 
                        sent50 = true; 
                    }
                    // דיווח 75%
                    if (percent >= 75 && !sent75) { 
                        reportToMake("Watched_75_Percent"); 
                        sent75 = true; 
                    }
                    // דיווח 95%
                    if (percent >= 95 && !sent95) { 
                        reportToMake("Watched_95_Percent"); 
                        sent95 = true; 
                    }
                }
            });
        });
    }, 5000);
</script>

</body>
</html>
