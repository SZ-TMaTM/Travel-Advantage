<script>
// פונקציה שרצה ברגע שהדף נטען
window.onload = function() {
    // התחברות לנגן של Bunny - ה-ID 586762 נלקח מהתמונות שלך
    var player = b9c.getPlayer('586762'); 

    player.on('progress', function(data) {
        // הפיכת הנתון לאחוז עגול (0 עד 100)
        var percent = Math.round(data.percent * 100);
        var statusToSend = "";

        // בדיקה אם הגענו לאחד מציוני הדרך שקבענו
        if (percent === 25) statusToSend = "25%";
        if (percent === 75) statusToSend = "75%";
        if (percent === 95) statusToSend = "95%";

        // אם הגענו לאחוז הרצוי - שולחים ל-Make
        if (statusToSend !== "") {
            fetch('https://hook.eu1.make.com/60mbe87l2p39x6j9579oowatj1m6m0r9', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    "phone": "972504746464",
                    "status": statusToSend
                })
            })
            .then(response => {
                console.log("נשלח למייק: " + statusToSend);
            })
            .catch(error => {
                console.error("שגיאה בשליחה:", error);
            });
        }
    });
};
</script>
