<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tracking</title>
    <script src="https://iframe.mediadelivery.net/playerv2.js?id=YOUR_LIBRARY_ID"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        iframe { border: none; width: 100%; height: 100%; max-width: 1000px; aspect-ratio: 16/9; }
    </style>
</head>
<body>

    <div id="video-container" style="position:relative; width:100%; max-width:1000px;">
        <iframe id="bunny-video" 
            src="https://iframe.mediadelivery.net/embed/343132/903e1c66-0708-468a-b94d-167814b6ba36?autoplay=false" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const leadId = window.location.pathname.split('/').pop() || "unknown";
        const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";

        function sendToMake(status) {
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lead_id: leadId, status: status, timestamp: new Date().toISOString() })
            }).catch(err => console.log("Reporting failed, but we tried."));
        }

        // דיווח ראשוני על טעינת הדף - תמיד עובד
        sendToMake("Page_Loaded");

        // האזנה לנגן של Bunny - הגרסה האגרסיבית
        const player = new BunnyCDNPlayer('bunny-video');

        player.on('ended', function() {
            sendToMake("Watched_100_Percent");
        });

        // עקיפה בטוחה: אם הנגן לא מדווח, אנחנו בודקים את הזמן כל 5 שניות
        setInterval(() => {
            player.getCurrentTime((time) => {
                player.getDuration((duration) => {
                    if (time > 0 && duration > 0) {
                        if (time >= duration * 0.95) {
                            sendToMake("Watched_100_Percent");
                        } else if (time >= duration * 0.5) {
                            sendToMake("Watched_50_Percent");
                        }
                    }
                });
            });
        }, 5000);
    </script>
</body>
</html>
