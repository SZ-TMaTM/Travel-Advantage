<script>
    const pathParts = window.location.pathname.split('/');
    const leadId = pathParts[pathParts.length - 1] || 'General_Visitor';
    const webhookUrl = "https://hook.eu1.make.com/6n76h8v83f8b8p8p8p8p8p8p8p8p8p8p"; 

    function reportToMake(status) {
        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                lead_id: leadId, 
                status: status, 
                language: "Hebrew",
                timestamp: new Date().toISOString()
            })
        }).catch(err => console.log('Reporting skip'));
    }

    var player = new BJLPlayer('bunny-video');
    
    let reported12Min = false;
    let reported75 = false;
    let reported95 = false;

    // 1. פרמטר ראשון: פתח וצפה (נשלח מיד בסטארט)
    player.on('play', function() { 
        reportToMake('Started_Viewing_HE'); 
    });

    player.on('timeupdate', function(data) {
        const currentTime = data.currentTime; // בשניות
        const duration = data.duration;
        const percentage = (currentTime / duration) * 100;

        // 2. פרמטר שני: צפה 12 דקות ומעלה (720 שניות)
        if (currentTime >= 720 && !reported12Min) {
            reportToMake('Viewed_Over_12_Minutes_HE');
            reported12Min = true;
        }

        // 3. פרמטר שלישי: צפה 75%
        if (percentage >= 75 && !reported75) {
            reportToMake('Viewed_75_Percent_HE');
            reported75 = true;
        }

        // 4. פרמטר רביעי: צפה 95%
        if (percentage >= 95 && !reported95) {
            reportToMake('Viewed_95_Percent_HE');
            reported95 = true;
        }
    });

    // הערה ליהושע: מי שקיבל סטטוס "Started" אבל לא קיבל "Over_12_Minutes" - נחשב אוטומטית כמי שצפה פחות מ-12 דקות.
</script>
