<script src="https://iframe.mediadelivery.net/playerv2.js"></script>
<script>
    // שליפת נתונים מהכתובת (URL)
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || "ללא טלפון";
    const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
    
    let sent12Min = false, sent20Min = false, sent25Min = false;

    // פונקציה אחידה לשליחת נתונים ל-Make
    function report(status) {
        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                phone: phone, 
                status: status 
            })
        })
        .then(() => console.log("נשלח ל-Make:", status))
        .catch(err => console.log('שגיאת שליחה:', err));
    }

    // דיווח ראשוני כשהדף נטען
    report("Page_Loaded");

    window.onload = function() {
        if (typeof BunnyCDNPlayer !== 'undefined') {
            const player = new BunnyCDNPlayer('bunny-video');
            
            // בדיקה כל 5 שניות
            setInterval(() => {
                player.getCurrentTime((time) => {
                    // 1. בדיקה של 12 דקות (720 שניות)
                    if (time >= 720 && !sent12Min) {
                        report("Watched_Over_12_Min");
                        sent12Min = true;
                    }

                    // 2. בדיקה של 20 דקות (1200 שניות - ה-75% שלך)
                    if (time >= 1200 && !sent20Min) {
                        report("Watched_Over_20_Min");
                        sent20Min = true;
                    }

                    // 3. בדיקה של 25 דקות (1500 שניות - ה-95% שלך)
                    if (time >= 1500 && !sent25Min) {
                        report("Watched_Over_25_Min");
                        sent25Min = true;
                    }
                });
            }, 5000);
        } else {
            console.error("BunnyCDNPlayer לא נטען");
        }
    };
</script>
