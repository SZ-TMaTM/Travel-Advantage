<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@900&display=swap" rel="stylesheet">
    <title>חופשה חלומית במחירים הכי זולים בעולם בהתחייבות!</title>

    <style>
        body { 
            font-family: 'Heebo', sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0; 
            padding: 15px;
        }

        .container { 
            max-width: 1150px; 
            margin: 20px auto; 
            background: white; 
            padding: 40px 20px; 
            border-radius: 25px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .main-title {
            font-size: clamp(16px, 4.2vw, 36px); 
            font-weight: 900;
            line-height: 1.6;
            margin-bottom: 30px;
            white-space: nowrap; 
            display: flex;
            justify-content: center;
            align-items: center;
            /* רווח גדול בין חלקי המשפט */
            gap: 25px; 
        }

        .flyer-style {
            padding: 0 10px; 
            letter-spacing: 0.5px; /* מוסיף רווח קטן בין האותיות עצמן */
            text-shadow: 
                -1.5px -1.5px 0 #000,  
                 1.5px -1.5px 0 #000,
                -1.5px  1.5px 0 #000,
                 1.5px  1.5px 0 #000, 
                 4px  4px 0px rgba(0,0,0,0.8);
        }

        .yellow-text { 
            color: #ffcc00; 
            margin-left: 10px; /* דוחף את הטקסט הצהוב שמאלה מהטקסט הלבן */
        }
        
        .white-text { 
            color: #ffffff; 
        }
        
        .red-badge { 
            background: #e60000; 
            color: white; 
            padding: 6px 20px; 
            border-radius: 10px; 
            box-shadow: 3px 3px 0px #000;
            margin-right: 20px; /* רווח גדול לפני הבועה האדומה */
        }

        .video-wrapper { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 20px; 
            background: #000; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 5px solid #fff;
        }
        
        .video-wrapper iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        /* בנייד - כשזה יורד שורה, שעדיין יהיה רווח יפה */
        @media (max-width: 768px) {
            .main-title { 
                white-space: normal; 
                flex-wrap: wrap;
                gap: 15px;
                line-height: 2.2;
            }
            .yellow-text { margin-left: 0; }
            .red-badge { margin-right: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">
        <span class="flyer-style yellow-text">חופשה חלומית</span>
        <span class="flyer-style white-text">במחירים הכי זולים בעולם</span>
        <span class="red-badge">בהתחייבות!</span>
    </div>
    
    <div class="video-wrapper">
        <iframe id="bunny-video" src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=false" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
</div>

<script src="https://iframe.mediadelivery.net/play/static/player.js"></script>
<script>
    // הקוד של יהושע ו-Make נשאר כאן
    const urlParams = new URLSearchParams(window.location.search);
    const leadId = urlParams.get('lead') || 'General_Visitor';
    const webhookUrl = "https://hook.eu1.make.com/6n76h8v83f8b8p8p8p8p8p8p8p8p8p8p"; 

    function reportToMake(status) {
        fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lead_id: leadId, status: status, language: "Hebrew" })
        });
    }

    var player = new BJLPlayer('bunny-video');
    player.on('play', function() { reportToMake('Started_Viewing_HE'); });
</script>

</body>

</html>
