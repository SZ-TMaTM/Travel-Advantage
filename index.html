<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <title>חופשה חלומית - Travel Advantage</title>
    <style>
        body { font-family: 'Heebo', sans-serif; text-align: center; background-color: #f4f7f9; margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: 10px auto; background: white; padding: 30px 20px; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
        .main-title { font-size: clamp(18px, 4.5vw, 34px); font-weight: 900; line-height: 1.4; margin-bottom: 25px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
        .flyer-style { padding: 0 5px; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 4px 4px 0px rgba(0,0,0,0.8); }
        .yellow-text { color: #ffcc00; } .white-text { color: #ffffff; }
        .red-badge { background: #e60000; color: white; padding: 6px 20px; border-radius: 12px; box-shadow: 3px 3px 0px #000; font-size: 0.85em; }
        .video-wrapper { position: relative; width: 100%; max-width: 920px; margin: 0 auto; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: #000; border: 5px solid #fff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="main-title">
        <span class="flyer-style yellow-text">חופשה חלומית</span>
        <span class="flyer-style white-text">במחירים הכי זולים בעולם</span>
        <span class="red-badge">בהתחייבות!</span>
    </div>
    
    <div class="video-wrapper">
        <iframe id="bunny-video" src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=true" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
</div>

<script>
    // הגדרות
    const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || "972504746464";
    
    let timer = 0;
    let sent = { '25': false, '75': false, '95': false };

    // פונקציית הדיווח למייק
    function reportToMake(statusValue) {
        fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                phone: phone,
                status: statusValue
            })
        });
        console.log(">>> דיווח נשלח למייק: " + statusValue);
    }

    // דיווח ראשון מיד כשהדף נטען
    reportToMake("Page_Loaded");

    // סטופר שרץ כל שנייה
    setInterval(() => {
        timer++;
        
        // אחרי 10 שניות - שלח דיווח "25" (לבדיקה)
        if (timer === 10 && !sent['25']) {
            reportToMake("25");
            sent['25'] = true;
        }

        // הדפסה לקונסול כל 5 שניות כדי לראות שזה עובד
        if (timer % 5 === 0) {
            console.log("הסטופר עובד: " + timer + " שניות");
        }
    }, 1000);
</script>
</body>
</html>
