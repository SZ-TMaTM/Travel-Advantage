<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>חופשה חלומית - הצטרפות</title>
    <style>
        body { font-family: 'Heebo', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 10px; }
        .container { max-width: 1050px; margin: 5px auto; background: white; padding: 25px 20px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .main-title { font-size: clamp(18px, 4vw, 32px); font-weight: 900; line-height: 1.4; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .flyer-style { padding: 0 10px; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 4px 4px 0px rgba(0,0,0,0.8); }
        .yellow-text { color: #ffcc00; }
        .white-text { color: #ffffff; }
        .red-badge { background: #e60000; color: white; padding: 5px 18px; border-radius: 10px; box-shadow: 3px 3px 0px #000; }
        .video-wrapper { position: relative; width: 100%; max-width: 950px; margin: 0 auto; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 20px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 4px solid #fff; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">
        <span class="flyer-style yellow-text">חופשה חלומית</span>
        <span class="flyer-style white-text">במחירים הכי זולים בעולם</span>
        <span class="red-badge">בהתחייבות!</span>
    </div>

    <div class="video-wrapper">
        <iframe id="bunny-video" src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=false" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
</div>

<script src="https://iframe.mediadelivery.net/play/static/player.js"></script>

<script>
    // 1. פונקציה לזיהוי הליד מהכתובת
    function getLeadId() {
        const path = window.location.pathname;
        const parts = path.split('/').filter(p => p.length > 0);
        return parts.length > 0 ? parts[parts.length - 1] : 'General_Visitor';
    }

    const leadId = getLeadId();
    const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";

    // 2. פונקציית הדיווח ל-Make
    function sendReportToMake(status) {
        const data = {
            lead_id: leadId,
            status: status,
            full_url: window.location.href,
            timestamp: new Date().toISOString()
        };

        // שליחה באמצעות fetch עם ביטול הגבלות CORS
        fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            console.log("דיווח נשלח בהצלחה ל-Make:", status);
        }).catch(err => {
            console.error("שגיאה בשליחה:", err);
        });
    }

    // 3. חיבור לאירועים של הנגן
    const player = new BJLPlayer('bunny-video');

    player.on('play', function() {
        sendReportToMake('Started_Viewing');
    });

    player.on('ended', function() {
        sendReportToMake('Finished_Video');
    });
</script>

</body>
</html>
