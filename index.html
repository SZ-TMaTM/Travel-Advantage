<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצגת וידאו</title>
    <script src="https://iframe.mediadelivery.net/playerv2.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background-color: #f0f2f5; /* רקע בהיר ונעים */
            font-family: 'Assistant', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 25px;
            max-width: 800px;
        }
        h1 { color: #1a73e8; margin-bottom: 10px; font-size: 2.2em; }
        h2 { color: #5f6368; font-weight: 400; margin: 5px 0; }
        
        #video-container { 
            width: 100%; 
            max-width: 900px; 
            aspect-ratio: 16/9; 
            background: #fff;
            border-radius: 20px; /* פינות מעוגלות */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); /* צל עדין */
            border: 5px solid white;
        }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>ברוכים הבאים להדרכה</h1>
        <h2>צפו בסרטון עד הסוף כדי לקבל את ההצעה</h2>
        <h2>המערכת מזהה את התקדמות הצפייה שלכם</h2>
    </div>

    <div id="video-container">
        <iframe id="bunny-video" 
            src="https://player.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=true" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const leadId = window.location.pathname.split('/').pop() || "unknown";
        const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
        
        let sent50 = false, sent75 = false, sent95 = false;

        function sendToMake(status) {
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lead_id: leadId, status: status })
            }).catch(e => console.log("Report failed"));
        }

        // דיווח ראשון - פתיחת דף
        sendToMake("Page_Loaded");

        const player = new BunnyCDNPlayer('bunny-video');

        setInterval(() => {
            player.getCurrentTime((time) => {
                player.getDuration((duration) => {
                    if (duration > 0) {
                        const percent = (time / duration) * 100;
                        
                        // דיווח מעל 12 דקות (50%)
                        if (percent >= 50 && !sent50) { 
                            sendToMake("Watched_Over_12_Min"); 
                            sent50 = true; 
                        }
                        // דיווח 75%
                        if (percent >= 75 && !sent75) { 
                            sendToMake("Watched_75_Percent"); 
                            sent75 = true; 
                        }
                        // דיווח 95% (סיום)
                        if (percent >= 95 && !sent95) { 
                            sendToMake("Watched_95_Percent"); 
                            sent95 = true; 
                        }
                    }
                });
            });
        }, 5000);
    </script>
</body>
</html>
