<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>חופשה חלומית - הצטרפות</title>
    <style>
        body { font-family: 'Heebo', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 10px; }
        .container { max-width: 1050px; margin: 5px auto; background: white; padding: 25px 20px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .main-title { font-size: clamp(18px, 4vw, 32px); font-weight: 900; line-height: 1.4; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .flyer-style { padding: 0 10px; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 4px 4px 0px rgba(0,0,0,0.8); }
        .yellow-text { color: #ffcc00; }
        .white-text { color: #ffffff; }
        .red-badge { background: #e60000; color: white; padding: 5px 18px; border-radius: 10px; box-shadow: 3px 3px 0px #000; }
        
        /* אזור הוידאו */
        .video-wrapper { position: relative; width: 100%; max-width: 950px; margin: 0 auto; padding-bottom: 56.25%; height: 0; border-radius: 20px; background: #000; border: 4px solid #fff; overflow: hidden; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* השכבה השקופה שתופסת את הלחיצה */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; background: rgba(0,0,0,0); }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">
        <span class="flyer-style yellow-text">חופשה חלומית</span>
        <span class="flyer-style white-text">במחירים הכי זולים בעולם</span>
        <span class="red-badge">בהתחייבות!</span>
    </div>

    <div class="video-wrapper">
        <div id="overlay"></div>
        <iframe id="bunny-video" src="https://iframe.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=false" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
</div>

<script>
    // 1. זיהוי הליד
    const leadId = window.location.pathname.split('/').filter(p => p.length > 0).pop() || 'General_Visitor';
    const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";

    // 2. פונקציית דיווח
    function reportToMake() {
        const data = {
            lead_id: leadId,
            status: "Started_Viewing",
            timestamp: new Date().toISOString()
        };

        // שליחה מהירה
        fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(data)
        });
        
        console.log("דיווח נשלח עבור: " + leadId);
    }

    // 3. כשלוחצים על הוידאו
    document.getElementById('overlay').addEventListener('click', function() {
        reportToMake(); // שלח ל-Make
        this.style.display = 'none'; // העלם את השכבה כדי שאפשר יהיה ללחוץ על הוידאו עצמו
    });
</script>

</body>
</html>
