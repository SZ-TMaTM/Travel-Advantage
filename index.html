<script>
(function() {
    function initBunnyTracking() {
        // בדיקה שהנגן קיים בדף
        if (typeof b9c !== 'undefined') {
            var player = b9c.getPlayer('586762');
            
            player.on('progress', function(data) {
                var percent = Math.round(data.percent * 100);
                var statusToSend = "";

                if (percent === 25) statusToSend = "25%";
                if (percent === 75) statusToSend = "75%";
                if (percent === 95) statusToSend = "95%";

                if (statusToSend !== "") {
                    fetch('https://hook.eu1.make.com/60mbe87l2p39x6j9579oowatj1m6m0r9', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            "phone": "972504746464",
                            "status": statusToSend
                        })
                    }).then(() => console.log("Sent to Make: " + statusToSend))
                      .catch(err => console.error("Error:", err));
                }
            });
            console.log("Bunny Tracking Initialized");
        } else {
            // אם הנגן עוד לא נטען, ננסה שוב בעוד חצי שנייה
            setTimeout(initBunnyTracking, 500);
        }
    }

    // הפעלת הפונקציה
    if (document.readyState === 'complete') {
        initBunnyTracking();
    } else {
        window.addEventListener('load', initBunnyTracking);
    }
})();
</script>
