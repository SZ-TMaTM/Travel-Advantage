<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Advantage</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; max-width: 90%; width: 600px; }
        h1 { color: #333; margin-bottom: 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; }
        .agent-info { margin-top: 15px; color: #555; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Travel Advantage</h1>
        
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
        </div>

        <p>ברוכים הבאים לדף ההסבר שלנו</p>
        
        <div id="agent-display" class="agent-info"></div>
    </div>

    <script>
        // פונקציה שמושכת את כל מה שמופיע אחרי הלוכסן האחרון
        function getAgentFromPath() {
            const path = window.location.pathname; // לוקח את הנתיב מהכתובת
            const parts = path.split('/'); // מחלק לפי לוכסנים
            const lastPart = parts[parts.length - 1]; // לוקח את החלק האחרון
            
            if (lastPart && lastPart !== "" && lastPart !== "index.html") {
                return decodeURIComponent(lastPart);
            }
            return null;
        }

        const agentID = getAgentFromPath();
        if (agentID) {
            document.getElementById('agent-display').innerText = "מזהה הפנייה: " + agentID.replace(/_/g, ' ');
        }
    </script>
</body>
</html>
