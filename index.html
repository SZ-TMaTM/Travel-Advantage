<script>
    const leadId = window.location.pathname.split('/').filter(p => p.length > 0).pop() || 'General_Visitor';
    const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
    let sentMilestones = new Set();

    function sendToMake(status) {
        if (sentMilestones.has(status)) return;
        sentMilestones.add(status);
        
        // שליחה פשוטה ומהירה
        fetch(webhookUrl + "?lead_id=" + leadId + "&status=" + status, {
            method: 'POST',
            mode: 'no-cors'
        });
        console.log("דיווח נשלח: " + status);
    }

    // הקשבה לסרטון
    window.addEventListener("message", function(event) {
        if (event.origin !== "https://iframe.mediadelivery.net") return;
        let data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

        if (data.event === "play") sendToMake('Started_Viewing');
        
        if (data.event === "timeupdate") {
            const progress = (data.value / data.duration) * 100;
            const minutes = data.value / 60;

            if (minutes >= 12) sendToMake('Watched_12Min_Plus');
            if (progress >= 75) sendToMake('Watched_75_Percent');
            if (progress >= 95) sendToMake('Watched_100_Percent');
        }
    });
</script>
