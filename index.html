<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצגת וידאו - גרסה סופית</title>
    <script src="https://iframe.mediadelivery.net/playerv2.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background-color: #f7f9fc; 
            font-family: 'Assistant', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* העיצוב המדויק של הכותרות מהגרסה ששלחת */
        .header-section { text-align: center; margin-bottom: 35px; width: 100%; max-width: 900px; }
        
        .main-title { 
            font-size: 2.5em; font-weight: 800; color: #1a237e; margin-bottom: 20px; 
        }

        .title-block {
            background: #ffffff;
            padding: 18px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-right: 6px solid #1a73e8; /* פס דקורטיבי בצד */
            margin-bottom: 15px;
            display: inline-block;
        }

        .title-block h2 { 
            margin: 0; font-size: 1.5em; color: #0d47a1; 
        }

        .warning-note {
            background: #fff5f5;
            color: #c62828;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            display: inline-block;
            margin-top: 15px;
            border: 1px solid #ffcdd2;
        }

        /* עיצוב הנגן עם הקצוות המעוגלים */
        #video-container { 
            width: 100%; max-width: 900px; aspect-ratio: 16/9; 
            background: #fff; border-radius: 25px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 8px solid white;
        }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="main-title">ברוכים הבאים להדרכה</div>
        
        <div class="title-block">
            <h2>איך לבנות עסק רווחי בעולם התיירות ב-2026</h2>
        </div>
        
        <br>
        <div class="warning-note">
            ⚠️ נא לא לרענן את הדף - המערכת שומרת את זמן הצפייה שלך
        </div>
    </div>

    <div id="video-container">
        <iframe id="bunny-video" 
            src="https://player.mediadelivery.net/embed/586762/13242e8d-deb8-4f6e-a296-a55789f852ff?autoplay=true" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const leadId = window.location.pathname.split('/').pop() || "unknown";
        const webhookUrl = "https://hook.eu1.make.com/ce9hrcv5hyrivpp3tq5ah3rxh2sg5emy";
        
        let sent50 = false, sent75 = false, sent95 = false;

        function sendToMake(status) {
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lead_id: leadId, status: status })
            }).catch(e => console.log("Report error"));
        }

        // דיווח ראשוני
        sendToMake("Page_Loaded");

        const player = new BunnyCDNPlayer('bunny-video');

        // המנגנון החכם שבודק אחוזים כל 5 שניות
        setInterval(() => {
            player.getCurrentTime((time) => {
                player.getDuration((duration) => {
                    if (duration > 0) {
                        const percent = (time / duration) * 100;
                        if (percent >= 50 && !sent50) { sendToMake("Watched_Over_12_Min"); sent50 = true; }
                        if (percent >= 75 && !sent75) { sendToMake("Watched_75_Percent"); sent75 = true; }
                        if (percent >= 95 && !sent95) { sendToMake("Watched_95_Percent"); sent95 = true; }
                    }
                });
            });
        }, 5000);
    </script>
</body>
</html>
