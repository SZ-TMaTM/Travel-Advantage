<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <title>MWR Life Business Overview</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <style>
    body, html { margin: 0; padding: 0; font-family: 'Assistant', Arial, sans-serif; background-color: #000; color: white; }
    
    .hero-section {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop') no-repeat center center;
      background-size: cover; 
      background-attachment: fixed;
      min-height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
      /* צמצום הרווח העליון מ-40 ל-10 */
      padding-top: 10px;
    }

    .hero-container { max-width: 1000px; width: 100%; text-align: center; padding: 20px; }
    
    .logo { max-width: 180px; margin-bottom: 10px; }
    
    h1 { 
      font-size: 54px; font-weight: 900; color: #ff9d2b; 
      /* צמצום המרווח מעל ומתחת לכותרת */
      margin: 0 0 10px 0; line-height: 1.1; 
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8); 
    }
    
    h2 { 
      font-size: 30px; font-weight: 800; color: #ffffff;
      margin: 0 auto 25px auto; line-height: 1.4; 
      max-width: 850px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }

    .video-placeholder {
      width: 100%; max-width: 850px; aspect-ratio: 16/9; 
      background: rgba(0,0,0,0.85);
      border: 1.5px solid #ffffff; border-radius: 4px; 
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
    }
    .video-text { color: #ffffff; font-size: 26px; font-weight: bold; }
  </style>
</head>
<body>

  <section class="hero-section">
    <div class="hero-container">
      <img src="https://my.aimmwrlife.com/images/mwr-life-logo-white.png" class="logo">
      
      <h1>גלו את ההזדמנות של MWR Life</h1>
      
      <h2>למדו כיצד תוכלו לעזור לאנשים לחסוך בטיולים,<br>תוך בניית עסק שיכול לשנות את חייכם מן הקצה אל הקצה.</h2>
      
      <div class="video-placeholder">
        <div class="video-text">[ HERE YOU NEED TO PUT YOUR VIDEO CODE ]</div>
      </div>
    </div>
  </section>

</body>
</html>
